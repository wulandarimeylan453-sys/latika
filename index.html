<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi Suhu Terpisah</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h2>Konversi Suhu</h2>
    <div class="form-group">
        <label for="nilai">Nilai Suhu:</label>
        <input type="number" id="nilai" placeholder="Masukkan angka">
    </div>
    <div class="form-group">
        <label for="satuan">Satuan Asal:</label>
        <select id="satuan">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="R">Reamur (°R)</option>
            <option value="K">Kelvin (K)</option>
        </select>
    </div>
    <button onclick="konversi()">Hitung</button>

    <div class="result" id="hasil" style="display: none;">
        <strong>Hasil Konversi:</strong>
        <p id="res-c">-</p>
        <p id="res-r">-</p>
        <p id="res-f">-</p>
        <p id="res-k">-</p>
    </div>
</div>

<!-- Menghubungkan file JavaScript -->
<script src="script.js"></script>
</body>
</html>
